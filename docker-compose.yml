services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - POCKETBASE_URL
        - KDRIVE_API_TOKEN
        - KDRIVE_DRIVE_ID
        - BLOG_ROOT_DIR_ID
    environment:
      - PORT=${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    restart: unless-stopped
